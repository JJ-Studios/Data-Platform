<!-- static/index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastAPI Streaming Client (Markdown)</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      /* Styling for rendered markdown content */
      .markdown-content h1,
      .markdown-content h2,
      .markdown-content h3 {
        border-bottom: 1px solid #e5e7eb; /* dark:border-gray-700 */
        padding-bottom: 0.3em;
        margin-top: 1.5em;
        margin-bottom: 1em;
      }
      .dark .markdown-content h1,
      .dark .markdown-content h2,
      .dark .markdown-content h3 {
        border-bottom-color: #374151;
      }
      .markdown-content h1 {
        font-size: 2em;
        font-weight: 600;
      }
      .markdown-content h2 {
        font-size: 1.5em;
        font-weight: 600;
      }
      .markdown-content h3 {
        font-size: 1.25em;
        font-weight: 600;
      }
      .markdown-content p {
        margin-bottom: 1em;
      }
      .markdown-content ul,
      .markdown-content ol {
        margin-left: 1.5em;
        margin-bottom: 1em;
        list-style-position: outside;
      }
      .markdown-content li {
        margin-bottom: 0.25em;
      }
      .markdown-content code {
        background-color: #e5e7eb; /* dark:bg-gray-700 */
        padding: 0.2em 0.4em;
        margin: 0;
        font-size: 85%;
        border-radius: 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
      }
      .dark .markdown-content code {
        background-color: #374151;
      }
      .markdown-content pre {
        background-color: #1f2937; /* dark:bg-gray-800 */
        color: #d1d5db; /* dark:text-gray-300 */
        padding: 1em;
        border-radius: 8px;
        overflow-x: auto;
        margin-bottom: 1em;
      }
      .markdown-content pre code {
        background-color: transparent;
        padding: 0;
      }
      .markdown-content blockquote {
        padding-left: 1em;
        border-left: 0.25em solid #d1d5db; /* dark:border-gray-600 */
        color: #6b7280; /* dark:text-gray-400 */
        margin-left: 0;
        margin-bottom: 1em;
      }
      .dark .markdown-content blockquote {
        border-left-color: #4b5563;
        color: #9ca3af;
      }
    </style>
  </head>
  <body
    class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 flex items-center justify-center min-h-screen py-8"
  >
    <div class="w-full max-w-3xl mx-auto p-4 md:p-6">
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6">
        <h1
          class="text-2xl md:text-3xl font-bold text-center mb-4 text-gray-900 dark:text-white"
        >
          Streaming Markdown Client
        </h1>
        <p class="text-center text-gray-500 dark:text-gray-400 mb-6">
          Enter a prompt to get a streamed Markdown response from your FastAPI
          endpoint.
        </p>

        <form id="prompt-form" class="space-y-4">
          <div>
            <label
              for="prompt-input"
              class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
              >Your Prompt</label
            >
            <textarea
              id="prompt-input"
              rows="3"
              class="w-full p-3 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
              placeholder="e.g., Explain the theory of relativity in simple terms"
            ></textarea>
          </div>
          <button
            type="submit"
            id="submit-button"
            class="w-full bg-blue-600 text-white font-semibold py-3 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 dark:focus:ring-offset-gray-800 transition-colors disabled:bg-gray-400 dark:disabled:bg-gray-500"
          >
            Send Prompt
          </button>
        </form>

        <div id="response-container" class="mt-6">
          <h2 class="text-xl font-semibold mb-3 text-gray-900 dark:text-white">
            Response
          </h2>
          <div
            id="response-output"
            class="w-full p-4 min-h-[150px] bg-gray-50 dark:bg-gray-900/50 rounded-lg border border-gray-200 dark:border-gray-700 markdown-content"
          >
            <span class="text-gray-400 dark:text-gray-500"
              >Waiting for prompt...</span
            >
          </div>
        </div>
        <div
          id="error-message"
          class="hidden mt-4 p-3 bg-red-100 dark:bg-red-900/50 border border-red-400 dark:border-red-600 text-red-700 dark:text-red-300 rounded-lg"
        ></div>
      </div>
    </div>

    <script>
      const promptForm = document.getElementById("prompt-form");
      const promptInput = document.getElementById("prompt-input");
      const submitButton = document.getElementById("submit-button");
      const responseOutput = document.getElementById("response-output");
      const errorMessage = document.getElementById("error-message");
      const API_URL = "/v1/completions/stream";

      // Variable to hold the complete response text
      let fullResponseText = "";

      promptForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const prompt = promptInput.value.trim();
        if (!prompt) {
          showError("Please enter a prompt.");
          return;
        }

        setLoadingState(true);
        clearOutput();

        try {
          const response = await fetch(API_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "text/event-stream",
            },
            body: JSON.stringify({ prompt: prompt }),
          });

          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(
              `HTTP error! status: ${response.status}, message: ${errorText}`
            );
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const parts = buffer.split("\n\n");
            buffer = parts.pop();

            for (const part of parts) {
              if (part.trim() === "") continue;
              if (part.startsWith("data: ")) {
                const content = part.substring(6);
                // Append new content to our full response string
                fullResponseText += content;
                // Convert the entire markdown string to HTML and render it
                responseOutput.innerHTML = marked.parse(fullResponseText);
              }
            }
          }

          // Final render for any remaining content in the buffer
          if (buffer.startsWith("data: ")) {
            fullResponseText += buffer.substring(6);
            responseOutput.innerHTML = marked.parse(fullResponseText);
          }
        } catch (error) {
          console.error("Error fetching stream:", error);
          showError(
            "Failed to connect to the server or process the stream. Check the console for more details."
          );
        } finally {
          setLoadingState(false);
        }
      });

      function clearOutput() {
        fullResponseText = ""; // Reset the response text
        responseOutput.innerHTML = "";
        errorMessage.classList.add("hidden");
        errorMessage.textContent = "";
      }

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.classList.remove("hidden");
      }

      function setLoadingState(isLoading) {
        submitButton.disabled = isLoading;
        promptInput.disabled = isLoading;
        if (isLoading) {
          clearOutput();
          submitButton.textContent = "Generating...";
        } else {
          submitButton.textContent = "Send Prompt";
          if (responseOutput.innerHTML.trim() === "") {
            responseOutput.innerHTML =
              '<span class="text-gray-400 dark:text-gray-500">No content received.</span>';
          }
        }
      }
    </script>
  </body>
</html>
